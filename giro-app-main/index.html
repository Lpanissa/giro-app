<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
    <!-- Altere a cor do tema para combinar com o fundo claro do app, evitando a barra/tela preta -->
    <meta name="theme-color" content="#f8fafc" />
    <meta name="description" content="Controle financeiro, de estoque e rotas de vendas" />
    <title>Giro</title>
    <meta property="og:image" content="https://bolt.new/static/og_default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png" />
    <style>
      /* Garante que o fundo do navegador nasce na cor clara do app */
      html, body {
        background-color: #f8fafc !important;
        margin: 0;
        padding: 0;
      }
      /* Força a ocultação de qualquer tela preta ou loader injetado pelo ambiente */
      #app-loading, [id*="loading"], [class*="loading"], .splash, #splash {
        display: none !important;
        opacity: 0 !important;
        visibility: hidden !important;
      }
      /* Efeito de tela ofuscada (loading suave) */
      #app-overlay {
        position: fixed;
        inset: 0;
        background-color: rgba(248, 250, 252, 0.85);
        backdrop-filter: blur(4px);
        z-index: 99999;
        transition: opacity 0.2s ease;
      }
    </style>
    <script>
      // Remove instantaneamente qualquer resquício de tela preta antiga que tente injetar
      const killOldLoader = () => {
        const oldLoader = document.getElementById('app-loading') || document.querySelector('.app-loading');
        if (oldLoader) oldLoader.remove();
      };
      document.addEventListener('DOMContentLoaded', killOldLoader);
      setInterval(killOldLoader, 10);
    </script>
  </head>
  <body class="bg-slate-50 text-slate-800">
    <!-- Removido o bloco "app-loading" com o logo que causava o flash preto -->
    <div id="app-overlay"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Remove o overlay assim que o React injetar conteúdo na raiz
      const observer = new MutationObserver(() => {
        const root = document.getElementById('root');
        if (root && root.children.length > 0) {
          const overlay = document.getElementById('app-overlay');
          if (overlay) {
            overlay.style.opacity = '0';
            setTimeout(() => overlay.remove(), 200);
          }
          observer.disconnect();
        }
      });
      observer.observe(document.getElementById('root'), { childList: true });
    </script>
  </body>
</html>
