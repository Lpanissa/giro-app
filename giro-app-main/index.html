<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Controle financeiro, de estoque e rotas de vendas" />
    <title>Giro</title>
    <meta property="og:image" content="https://bolt.new/static/og_default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png" />
    <style>
      /* Garante que o fundo do navegador nasce em branco puro */
      html, body {
        background-color: #ffffff !important;
        margin: 0;
        padding: 0;
      }
      /* Ofuscado leve enquanto o React ainda não montou o conteúdo */
      #app-overlay {
        position: fixed;
        inset: 0;
        background-color: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(4px);
        z-index: 99999;
        transition: opacity 0.2s ease;
      }
      /* Rodinha de carregamento discreta, centralizada no overlay */
      @keyframes giro-spin {
        to { transform: rotate(360deg); }
      }
      #app-overlay::after {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 28px;
        height: 28px;
        margin: -14px 0 0 -14px;
        border: 3px solid rgba(15, 23, 42, 0.15);
        border-top-color: rgba(15, 23, 42, 0.55);
        border-radius: 50%;
        animation: giro-spin 0.8s linear infinite;
      }
    </style>
  </head>
  <body class="bg-white text-slate-800">
    <div id="app-overlay"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Remove o overlay assim que o React injetar conteúdo na raiz
      const observer = new MutationObserver(() => {
        const root = document.getElementById('root');
        if (root && root.children.length > 0) {
          const overlay = document.getElementById('app-overlay');
          if (overlay) {
            overlay.style.opacity = '0';
            setTimeout(() => overlay.remove(), 200);
          }
          observer.disconnect();
        }
      });
      observer.observe(document.getElementById('root'), { childList: true });
    </script>
  </body>
</html>
